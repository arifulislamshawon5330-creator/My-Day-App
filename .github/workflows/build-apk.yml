name: Build My Day APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'My_Day_Full_Android_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          mkdir project
          unzip -q My_Day_Full_Android_Project.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Java and Kotlin JVM target compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('project/app/build.gradle')
          s = p.read_text()
          marker = "    defaultConfig {"
          addition = """    compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

          """
          if 'kotlinOptions' not in s:
              if marker not in s:
                  raise SystemExit('Could not find defaultConfig block in app/build.gradle')
              s = s.replace(marker, addition + marker, 1)
          p.write_text(s)
          PY

      - name: Build debug APK
        run: gradle --no-daemon -p project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Day-debug-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
